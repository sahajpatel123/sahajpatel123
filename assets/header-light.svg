<svg xmlns="http://www.w3.org/2000/svg" width="900" height="186" viewBox="0 0 900 186" role="img" aria-label="Sahaj Patel — student, builder, systems thinker">
  <title>Sahaj Patel</title>
  <defs>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="240" y1="0" x2="660" y2="0">
      <stop offset="0" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0969da" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .kicker { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 1.6px; fill: #59636e; text-anchor: middle; }
    .name { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif; font-size: 52px; font-weight: 600; letter-spacing: -1.2px; fill: #0d1117; text-anchor: middle; }
    .sub { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 15px; fill: #59636e; text-anchor: middle; }
    .caret { fill: #0969da; animation: blink 1.1s steps(2, start) infinite; }
    .phrase { opacity: 0; animation: cycle 18s linear infinite; }
    .rise { animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .fade { animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.25s both; }
    .draw { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 1.6s cubic-bezier(0.3, 0.8, 0.2, 1) 0.4s both; }
    .dot { animation: beat 2.6s ease-in-out infinite; }
    @keyframes cycle{0%{opacity:0}1.5%{opacity:1}21.667%{opacity:1}25%{opacity:0}100%{opacity:0}}
    @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: 0 } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    @keyframes beat { 0%, 100% { opacity: 1 } 50% { opacity: 0.35 } }
    @media (prefers-reduced-motion: reduce) {
      .phrase, .caret, .rise, .fade, .draw, .dot { animation: none }
      .phrase { opacity: 0 }
      .phrase:first-of-type { opacity: 1 }
      .draw { stroke-dashoffset: 0 }
    }
  </style>

  <g class="fade">
    <circle cx="387.3" cy="44" r="3" fill="#0969da" class="dot"/>
    <circle cx="387.3" cy="44" r="3" fill="none" stroke="#0969da" stroke-width="1">
      <animate attributeName="r" values="3;12" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="458.5" y="48" class="kicker">SAHAJPATEL123</text>
  </g>

  <g class="rise">
    <text x="450" y="106" class="name">Sahaj Patel</text>
  </g>

  <g class="phrase" style="animation-delay:0s">
    <text x="450" y="142" class="sub">student · builder · systems thinker</text>
    <rect class="caret" x="612.5" y="130" width="1.8" height="15" rx="0.9"/>
  </g>
  <g class="phrase" style="animation-delay:4.5s">
    <text x="450" y="142" class="sub">agents · markets · simulations</text>
    <rect class="caret" x="590.0" y="130" width="1.8" height="15" rx="0.9"/>
  </g>
  <g class="phrase" style="animation-delay:9s">
    <text x="450" y="142" class="sub">first principles, then code</text>
    <rect class="caret" x="576.5" y="130" width="1.8" height="15" rx="0.9"/>
  </g>
  <g class="phrase" style="animation-delay:13.5s">
    <text x="450" y="142" class="sub">build quietly · ship clearly</text>
    <rect class="caret" x="581.0" y="130" width="1.8" height="15" rx="0.9"/>
  </g>

  <line x1="240" y1="170" x2="660" y2="170" stroke="url(#rule)" stroke-width="1.4" stroke-linecap="round" class="draw"/>
</svg>
