<svg xmlns="http://www.w3.org/2000/svg" width="900" height="228" viewBox="0 0 900 228" role="img" aria-label="Sahaj Patel — builds systems that reason">
  <title>Sahaj Patel</title>
  <defs>
    <radialGradient id="nebL">
      <stop offset="0" stop-color="#0969da" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="650" y2="0">
      <stop offset="0" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0969da" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .star { fill: #0969da; opacity: var(--b, 0.4); animation: twinkle 3.2s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: var(--b, 0.4) } 50% { opacity: calc(var(--b, 0.4) * 0.2) } }
    .neb { animation: drift 28s ease-in-out infinite alternate; }
    .neb.r { animation-duration: 36s; animation-direction: alternate-reverse; }
    @keyframes drift { from { transform: translateX(-14px) } to { transform: translateX(14px) } }
    .kicker { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 1.8px; fill: #59636e; text-anchor: middle; }
    .name { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 54px; font-weight: 600; letter-spacing: -1.4px; fill: #0d1117; text-anchor: middle; }
    .sub { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 14.5px; fill: #59636e; text-anchor: middle; }
    .caret { fill: #0969da; animation: blink 1.1s steps(2, start) infinite; }
    .phrase { opacity: 0; animation: cycle 16s linear infinite; }
    .rise { animation: rise 0.85s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .fade { animation: rise 0.85s cubic-bezier(0.2, 0.7, 0.2, 1) 0.2s both; }
    .draw { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.5s cubic-bezier(0.3, 0.8, 0.2, 1) 0.35s both; }
    .dot { animation: beat 2.8s ease-in-out infinite; }
    @keyframes cycle{0%{opacity:0}1.5%{opacity:1}21.562%{opacity:1}25%{opacity:0}100%{opacity:0}}
    @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: 0 } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    @keyframes beat { 0%, 100% { opacity: 1 } 50% { opacity: 0.35 } }
    @media (prefers-reduced-motion: reduce) {
      .star, .neb, .phrase, .caret, .rise, .fade, .draw, .dot { animation: none }
      .phrase { opacity: 0 }
      .phrase:first-of-type { opacity: 1 }
      .draw { stroke-dashoffset: 0 }
      .star { opacity: var(--b, 0.4) }
    }
  </style>

