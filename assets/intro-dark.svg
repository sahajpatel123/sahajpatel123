<svg xmlns="http://www.w3.org/2000/svg" width="900" height="236" viewBox="0 0 900 236" role="img" aria-label="Models coordinate, markets price uncertainty, contracts become legible">
  <title>models · markets · contracts</title>
  <defs>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="wash">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seam" gradientUnits="userSpaceOnUse" x1="220" y1="0" x2="680" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .node rect { fill: none; stroke: #30363d; stroke-width: 1.2; }
    .halo { fill: none; stroke: #58a6ff; stroke-width: 1.4; }
    .label { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 13px; fill: #f0f6fc; text-anchor: middle; }
    .verb { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 11px; fill: #8b949e; text-anchor: middle; }
    .wire { fill: none; stroke: #30363d; stroke-width: 1.2; stroke-dasharray: 3 5; stroke-linecap: round; }
    .arrow { fill: none; stroke: #30363d; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .pulse { fill: #58a6ff; filter: url(#glow); }
    .lede { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 15px; fill: #f0f6fc; text-anchor: middle; }
    .meta { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 12px; fill: #8b949e; text-anchor: middle; }
    .now { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 1.4px; fill: #8b949e; }
    .focus { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 12px; fill: #8b949e; opacity: 0; animation: focus 8s linear infinite; }
    .live { fill: #3fb950; animation: beat 2.2s ease-in-out infinite; }
    .wash { animation: drift 30s ease-in-out infinite alternate; }
    .wash.r { animation-duration: 38s; animation-direction: alternate-reverse; }
        @keyframes n0{0%{opacity:0}0%{opacity:0}0%{opacity:1}12.5%{opacity:1}17.5%{opacity:0}100%{opacity:0}}
    @keyframes n1{0%{opacity:0}30.333%{opacity:0}33.333%{opacity:1}45.833%{opacity:1}50.833%{opacity:0}100%{opacity:0}}
    @keyframes n2{0%{opacity:0}63.667%{opacity:0}66.667%{opacity:1}79.167%{opacity:1}84.167%{opacity:0}100%{opacity:0}}
    @keyframes p0{0%{opacity:0}12%{opacity:0}14.5%{opacity:1}31.333%{opacity:1}33.333%{opacity:0}100%{opacity:0}}
    @keyframes p1{0%{opacity:0}45.333%{opacity:0}47.833%{opacity:1}64.667%{opacity:1}66.667%{opacity:0}100%{opacity:0}}
    @keyframes focus{0%{opacity:0}2%{opacity:1}43.75%{opacity:1}50%{opacity:0}100%{opacity:0}}
        .h0 { animation: n0 7.2s linear infinite }
    .h1 { animation: n1 7.2s linear infinite }
    .h2 { animation: n2 7.2s linear infinite }
    .p0 { animation: p0 7.2s linear infinite }
    .p1 { animation: p1 7.2s linear infinite }
    @keyframes beat { 0%, 100% { opacity: 1 } 50% { opacity: 0.35 } }
    @keyframes drift { from { transform: translateX(-12px) } to { transform: translateX(12px) } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .halo, .focus, .live, .wash { animation: none }
      .pulse { opacity: 0 }
      .h0 { opacity: 1 }
      .focus { opacity: 0 }
      .focus:first-of-type { opacity: 1 }
    }
  </style>

  <ellipse class="wash" cx="200" cy="70" rx="160" ry="42" fill="url(#wash)"/>
  <ellipse class="wash r" cx="720" cy="90" rx="150" ry="40" fill="url(#wash)"/>

  <path class="wire" d="M 234.0 78.0 L 366.0 78.0"/>
  <path class="wire" d="M 534.0 78.0 L 666.0 78.0"/>
  <path class="arrow" d="M 361.0 74.6 L 366.0 78.0 L 361.0 81.4"/>
  <path class="arrow" d="M 661.0 74.6 L 666.0 78.0 L 661.0 81.4"/>
  <g class="node">
    <rect x="76.0" y="60" width="148" height="36" rx="18"/>
    <rect class="halo h0" x="76.0" y="60" width="148" height="36" rx="18" opacity="0"/>
    <text class="label" x="150" y="82.5">models</text>
    <text class="verb" x="150" y="110">coordinate</text>
  </g>
  <g class="node">
    <rect x="376.0" y="60" width="148" height="36" rx="18"/>
    <rect class="halo h1" x="376.0" y="60" width="148" height="36" rx="18" opacity="0"/>
    <text class="label" x="450" y="82.5">markets</text>
    <text class="verb" x="450" y="110">price uncertainty</text>
  </g>
  <g class="node">
    <rect x="676.0" y="60" width="148" height="36" rx="18"/>
    <rect class="halo h2" x="676.0" y="60" width="148" height="36" rx="18" opacity="0"/>
    <text class="label" x="750" y="82.5">contracts</text>
    <text class="verb" x="750" y="110">become legible</text>
  </g>
  <circle class="pulse p0" r="3.2" opacity="0">
    <animateMotion dur="7.2s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.1250;0.3333;1" keyPoints="0;0;1;1"
      path="M 234.0 78.0 L 366.0 78.0"/>
  </circle>
  <circle class="pulse p1" r="3.2" opacity="0">
    <animateMotion dur="7.2s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.4583;0.6667;1" keyPoints="0;0;1;1"
      path="M 534.0 78.0 L 666.0 78.0"/>
  </circle>

  <text class="lede" x="450" y="148">I build software where these three have to stay honest.</text>
  <text class="meta" x="450" y="172">TypeScript · Python · Go — usually deployed · usually measured</text>

  <line x1="220" y1="188" x2="680" y2="188" stroke="url(#seam)" stroke-width="1" stroke-linecap="round"/>

  <circle class="live" cx="150" cy="208" r="3.2"/>
  <circle cx="150" cy="208" r="3.2" fill="none" stroke="#3fb950" stroke-width="1">
    <animate attributeName="r" values="3.2;9" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text class="now" x="164" y="212">CURRENTLY</text>
  <text class="now" x="244" y="212" fill="#30363d">·</text>
  <text class="focus" x="258" y="212" style="animation-delay:0s">Condura · local conductor</text>
  <text class="focus" x="258" y="212" style="animation-delay:4s">poly-maker · regime machine</text>
</svg>
