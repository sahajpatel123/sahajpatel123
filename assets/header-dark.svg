<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Sahaj Patel — builds systems that reason">
  <title>Sahaj Patel</title>
  <defs>
    <radialGradient id="neb">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="650" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .neb { animation: drift 28s ease-in-out infinite alternate; }
    .neb.b { animation-duration: 36s; animation-direction: alternate-reverse; }
    @keyframes drift { from { transform: translateX(-14px) } to { transform: translateX(14px) } }
    .kicker { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 1.8px; fill: #8b949e; text-anchor: middle; }
    .name { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 54px; font-weight: 600; letter-spacing: -1.4px; fill: #f0f6fc; text-anchor: middle; }
    .sub { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 14.5px; fill: #8b949e; text-anchor: middle; }
    .caret { fill: #58a6ff; animation: blink 1.1s steps(2, start) infinite; }
    .phrase { opacity: 0; animation: cycle 16s linear infinite; }
    .rise { animation: rise 0.85s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .fade { animation: rise 0.85s cubic-bezier(0.2, 0.7, 0.2, 1) 0.2s both; }
    .draw { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.5s cubic-bezier(0.3, 0.8, 0.2, 1) 0.35s both; }
    .dot { animation: beat 2.8s ease-in-out infinite; }
    @keyframes cycle{0%{opacity:0}1.5%{opacity:1}21.562%{opacity:1}25%{opacity:0}100%{opacity:0}}
    @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: 0 } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    @keyframes beat { 0%, 100% { opacity: 1 } 50% { opacity: 0.35 } }
    @media (prefers-reduced-motion: reduce) {
      .neb, .phrase, .caret, .rise, .fade, .draw, .dot { animation: none }
      .phrase { opacity: 0 }
      .phrase:first-of-type { opacity: 1 }
      .draw { stroke-dashoffset: 0 }
    }
  </style>

  <ellipse class="neb" cx="148" cy="48" rx="132" ry="34" fill="url(#neb)"/>
  <ellipse class="neb b" cx="752" cy="182" rx="142" ry="36" fill="url(#neb)"/>

  <g class="fade">
    <circle cx="390.4" cy="38" r="2.8" fill="#58a6ff" class="dot"/>
    <circle cx="390.4" cy="38" r="2.8" fill="none" stroke="#58a6ff" stroke-width="1">
      <animate attributeName="r" values="2.8;10" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="458.0" y="42" class="kicker">SAHAJPATEL123</text>
  </g>

  <g class="rise">
    <text x="450" y="106" class="name">Sahaj Patel</text>
  </g>

  <g class="phrase" style="animation-delay:0s">
    <text x="450" y="158" class="sub">builds systems that reason</text>
    <rect class="caret" x="568.1" y="147" width="1.7" height="13" rx="0.85"/>
  </g>
  <g class="phrase" style="animation-delay:4s">
    <text x="450" y="158" class="sub">agents · markets · simulations</text>
    <rect class="caret" x="585.5" y="147" width="1.7" height="13" rx="0.85"/>
  </g>
  <g class="phrase" style="animation-delay:8s">
    <text x="450" y="158" class="sub">first principles, then code</text>
    <rect class="caret" x="572.5" y="147" width="1.7" height="13" rx="0.85"/>
  </g>
  <g class="phrase" style="animation-delay:12s">
    <text x="450" y="158" class="sub">small surfaces · honest defaults</text>
    <rect class="caret" x="594.2" y="147" width="1.7" height="13" rx="0.85"/>
  </g>

  <line x1="250" y1="198" x2="650" y2="198" stroke="url(#rule)" stroke-width="1.2" stroke-linecap="round" class="draw"/>
</svg>
