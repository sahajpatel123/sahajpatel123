<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-label="A quiet starfield">
  <title>starfield</title>
  <defs>
    <radialGradient id="nebA">
      <stop offset="0" stop-color="#0969da" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <style>
    .star { fill: #0969da; opacity: var(--b, 0.5); animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: var(--b, 0.5) } 50% { opacity: calc(var(--b, 0.5) * 0.25) } }
    .neb { animation: drift 26s ease-in-out infinite alternate; }
    .neb.b { animation-duration: 34s; animation-direction: alternate-reverse; }
    @keyframes drift { from { transform: translateX(-18px) } to { transform: translateX(18px) } }
    .comet { opacity: 0; animation: shoot 14s linear infinite; transform: translate(980px, 26px) rotate(162deg); transform-origin: 0 0; }
    @keyframes shoot {
      0%, 78% { opacity: 0; transform: translate(980px, 26px) }
      82% { opacity: 1 }
      90% { opacity: 1; transform: translate(-140px, 96px) }
      94%, 100% { opacity: 0; transform: translate(-140px, 96px) }
    }
    .head { fill: #0969da; }
    .tail { stroke: url(#tail); stroke-width: 1.4; stroke-linecap: round; }
    @media (prefers-reduced-motion: reduce) {
      .star, .neb, .comet { animation: none }
      .comet { opacity: 0 }
    }
  </style>

  <ellipse class="neb" cx="180" cy="60" rx="150" ry="40" fill="url(#nebA)"/>
  <ellipse class="neb b" cx="700" cy="70" rx="170" ry="44" fill="url(#nebA)"/>

